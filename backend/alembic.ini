# A generic, single-database configuration.

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# sys.path path, allowed to be list of directories or colon-separated paths.
# This allows Alembic to discover our application module.
prepend_sys_path = .

# timezone to use when rendering the date within the migration file as well as the DB table
# timezone = UTC

# version path override; default is alembic/versions.
# version_locations = %(here)s/bar:%(here)s/bat:alembic/versions

# version_path_separator = :

# logging configuration is defined in logging.ini sections below.

[post_write_hooks]

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
